name: build-maleoon

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch winlator-app upstream (pinned to match vortek-2.1 client)
        run: |
          git clone --filter=blob:none https://github.com/brunodev85/winlator-app.git src
          cd src
          git checkout 3daac248d17f3208e2fb8600673a835185d4957a
          git log -1 --oneline

      - name: Apply Maleoon (Kirin9010) patch
        run: python3 ci/apply_maleoon.py src/app
      - name: Apply Chinese localization
        run: python3 ci/apply_zh.py src/app

      - name: Inject CJK font into container pattern
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd fonts-wqy-microhei
          python3 ci/patch_cjk_font.py src/app
          cp ci/cjk_fonts.tzst src/app/src/main/assets/cjk_fonts.tzst
          ls -l src/app/src/main/assets/cjk_fonts.tzst


      - name: Build patched DXVK 1.10.3 (bypass FL gate)
        run: |
          set -e
          sudo apt-get install -y -qq zstd mingw-w64 glslang-tools ninja-build
          python3 -m pip install --quiet meson
          curl -sL -o /tmp/dxvk.tar.gz https://github.com/Sporif/dxvk-async/archive/refs/tags/1.10.3.tar.gz
          rm -rf /tmp/dxvk && mkdir -p /tmp/dxvk && tar xf /tmp/dxvk.tar.gz -C /tmp/dxvk --strip-components=1
          cd /tmp/dxvk
          # 新版 mingw-w64 (gcc13/14) 不再隐式包含 <cstdint>，DXVK 1.10.3 会报 uint32_t 未声明
          export CXXFLAGS="-include cstdint"
          export CFLAGS="-include stdint.h"
          x86_64-w64-mingw32-g++ --version | head -1
          # [maleoon] Vortek 客户端不回传 core VkPhysicalDeviceFeatures（全 0），
          # 导致 logicOp / variableMultisampleRate 等少数从驱动读取的位判为不支持，
          # CheckFeatureLevelSupport 一路 return false，FL 掉到 9_3。
          # 这里把该校验短接，只保留 GetMaxFeatureLevel 上限。
          sed -i 's|if (!adapter->checkFeatureSupport(features))|if (false \&\& !adapter->checkFeatureSupport(features))|' src/d3d11/d3d11_device.cpp
          grep -n "false && !adapter->checkFeatureSupport" src/d3d11/d3d11_device.cpp
          meson setup --cross-file build-win64.txt --buildtype release -Doptimization=3 -Dstrip=true build.w64
          # 只编 d3d11/dxgi（d3d9 模块在 mingw-w64 新版头文件下会重复定义，与本改动无关）
          ninja -C build.w64 src/d3d11/d3d11.dll src/dxgi/dxgi.dll
          ls -l build.w64/src/d3d11/d3d11.dll build.w64/src/dxgi/dxgi.dll
          # 32 位版本（大量 Unity 游戏是 x86）
          meson setup --cross-file build-win32.txt --buildtype release -Doptimization=3 -Dstrip=true build.w32
          ninja -C build.w32 src/d3d11/d3d11.dll src/dxgi/dxgi.dll
          ls -l build.w32/src/d3d11/d3d11.dll build.w32/src/dxgi/dxgi.dll
          # 只替换 64 位 d3d11/dxgi，其余 DLL 与原版保持一致（接口 ABI 未变）
          TZ="$GITHUB_WORKSPACE/src/app/src/main/assets/dxwrapper/dxvk-1.10.3.tzst"
          echo "TZST=$TZ"
          ls -l "$TZ"
          rm -rf /tmp/dxvkout && mkdir -p /tmp/dxvkout
          tar --use-compress-program=unzstd -xf "$TZ" -C /tmp/dxvkout
          cp -f build.w64/src/d3d11/d3d11.dll /tmp/dxvkout/system32/d3d11.dll
          cp -f build.w64/src/dxgi/dxgi.dll /tmp/dxvkout/system32/dxgi.dll
          cp -f build.w32/src/d3d11/d3d11.dll /tmp/dxvkout/syswow64/d3d11.dll
          cp -f build.w32/src/dxgi/dxgi.dll /tmp/dxvkout/syswow64/dxgi.dll
          ls -l /tmp/dxvkout/system32/d3d11.dll /tmp/dxvkout/syswow64/d3d11.dll
          tar --use-compress-program=zstd -cf "$TZ" -C /tmp/dxvkout system32 syswow64
          ls -l "$TZ"
          tar --use-compress-program=unzstd -tf "$TZ" | head -20
      - name: Show patched lines
        run: |
          grep -n "MaleoonVK\|0x19E5u" src/app/src/main/cpp/vortekrenderer/src/*.c \
            src/app/src/main/cpp/vortekrenderer/include/vk_context.h | head -20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK components (use preinstalled SDK)
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          SDKM=$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -1)
          echo "sdkmanager=$SDKM"
          if [ -z "$SDKM" ]; then echo "no sdkmanager found"; ls "$SDK" 2>/dev/null || true; exit 1; fi
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "ndk;24.0.8215888" "cmake;3.22.1"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          ls "$SDK/ndk" || true

      - name: Gradle assembleDebug
        run: |
          cd src
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs=-Xmx4g

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winlator-maleoon-debug
          path: |
            src/app/build/outputs/apk/debug/*.apk
            src/app/build/outputs/logs/*.txt
          if-no-files-found: warn