name: build-maleoon

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch winlator-app upstream
        run: |
          git clone --depth 1 https://github.com/brunodev85/winlator-app.git src
          cd src && git log -1 --oneline

      - name: Apply Maleoon (Kirin9010) patch
        run: python3 ci/apply_maleoon.py src

      - name: Show patched lines
        run: |
          grep -n "MaleoonVK\|0x19E5u" src/app/src/main/cpp/vortekrenderer/src/*.c src/app/src/main/cpp/vortekrenderer/include/vk_context.h | head -20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install SDK / NDK / CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" \
                     "ndk;24.0.8215888" "cmake;3.22.1"

      - name: Gradle assembleDebug
        run: |
          cd src
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs=-Xmx4g

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winlator-maleoon-debug
          path: |
            src/app/build/outputs/apk/debug/*.apk
            src/app/build/outputs/logs/*.txt
          if-no-files-found: warn