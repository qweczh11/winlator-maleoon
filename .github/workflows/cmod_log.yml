name: build-cmod-log

on:
  workflow_dispatch:
  push:
    paths:
      - 'ci/patch_cmod_log.py'
      - '.github/workflows/cmod_log.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android/sdk/ndk/25* /usr/local/lib/android/sdk/ndk/26* \
            /usr/local/lib/android/sdk/system-images /usr/local/lib/android/sdk/emulator || true
          df -h /

      - uses: actions/checkout@v4

      - name: Clone Cmod source (tag cmod_v13.1)
        run: |
          git clone --depth 1 --branch cmod_v13.1 --recurse-submodules --shallow-submodules \
            https://github.com/coffincolors/winlator.git src
          cd src
          git log -1 --oneline
          du -sh .

      - name: Fetch official v13.1.1 assets (imagefs.txz etc.)
        run: |
          set -e
          curl -L --retry 3 --retry-delay 5 -o /tmp/cmod.apk \
            https://github.com/coffincolors/winlator/releases/download/cmod_v13.1/Winlator-Cmod-v13.1.1.apk
          ls -l /tmp/cmod.apk
          rm -rf /tmp/assets && mkdir -p /tmp/assets
          unzip -o -q /tmp/cmod.apk 'assets/*' -d /tmp/assets
          ls -l /tmp/assets/assets/ | head -40
          cp -rf /tmp/assets/assets/. src/app/src/main/assets/
          ls -l src/app/src/main/assets/imagefs.txz
          rm -rf /tmp/cmod.apk /tmp/assets
          df -h /

      - name: Apply maleoon log patch
        run: python3 ci/patch_cmod_log.py src/app/src/main/java/com/winlator/cmod/core/ProcessHelper.java

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK components
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          SDKM=$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -1)
          echo "sdkmanager=$SDKM"
          if [ -z "$SDKM" ]; then echo "no sdkmanager found"; ls "$SDK" 2>/dev/null || true; exit 1; fi
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          ls "$SDK/ndk" || true

      - name: Build debug APK
        run: |
          cd src
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs=-Xmx5g

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmod-v13.1-log
          path: |
            src/app/build/outputs/apk/debug/*.apk
            src/app/build/outputs/logs/*.txt
          if-no-files-found: warn
